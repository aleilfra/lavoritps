
<!DOCTYPE html>
<html>
<head>
    <title>Convertitore di valute in Euro</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: lightgray;
        }

        h1 {
            color: blue;
        }

        .contenitore {
            background-color: white;
            width: 350px;
            margin: 100px auto;
            padding: 20px;
            border-radius: 10px;
        }

        input, select, button {
            padding: 10px;
            margin: 10px;
            width: 80%;
        }

        button {
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="contenitore">

    <h1>Convertitore Euro</h1>

    <p>Scegli la valuta:</p>

    <select id="valuta">
        <option value="">Seleziona valuta</option>
    </select>

    <p>Inserisci la quantità:</p>

    <input type="number" id="quantita" placeholder="Quantità">

    <br>

    <button onclick="converti()">Converti</button>

    <h3 id="risultato"></h3>

    <p id="messaggio"></p>

</div>

<script>

    var cambi = {};

    fetch("https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml")
    .then(response => response.text())
    .then(dati => {

        var parser = new DOMParser();
        var xml = parser.parseFromString(dati, "text/xml");

        var valute = xml.getElementsByTagName("Cube");

        var lista = document.getElementById("valuta");

        cambi["EUR"] = 1;

        var opzione = document.createElement("option");
        opzione.value = "EUR";
        opzione.text = "Euro (EUR)";
        lista.appendChild(opzione);

        for (var i = 0; i < valute.length; i++) {

            var codice = valute[i].getAttribute("currency");
            var cambio = valute[i].getAttribute("rate");

            if (codice != null) {

                cambi[codice] = parseFloat(cambio);

                var opzione = document.createElement("option");
                opzione.value = codice;
                opzione.text = codice;

                lista.appendChild(opzione);
            }
        }

        document.getElementById("messaggio").innerHTML =
        "Valute caricate correttamente!";

    })
    .catch(function() {

        document.getElementById("messaggio").innerHTML =
        "Errore nel caricamento delle valute.";

    });


    function converti() {

        var valuta = document.getElementById("valuta").value;

        var quantita = parseFloat(
            document.getElementById("quantita").value
        );

        if (valuta == "" || isNaN(quantita) || quantita < 0) {

            alert("Inserisci una quantità e seleziona una valuta!");
            return;

        }

        var euro = quantita / cambi[valuta];

        document.getElementById("risultato").innerHTML =
        "Risultato: " + euro.toFixed(2) + " Euro";

    }

</script>

</body>
</html>
